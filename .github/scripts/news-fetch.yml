name: Nightly news fetch

on:
  schedule:
    # 09:00 UTC = 5:00 AM Eastern (daylight saving). Winter: "0 10 * * *".
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install firebase-admin@12 fast-xml-parser@4 --no-save
      - name: Fetch feeds and write to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/news-fetch.mjs
