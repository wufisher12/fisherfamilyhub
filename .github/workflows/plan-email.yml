name: Nightly plan email

on:
  schedule:
    # 01:00 UTC = 9:00 PM Eastern during daylight saving (Mar–Nov).
    # In winter change to "0 2 * * *" to stay at 9:00 PM Eastern.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install firebase-admin@12 --no-save
      - name: Build tomorrow's plan email
        id: gen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/plan-email.mjs
      - name: Send it
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Fisher Family Hub <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ steps.gen.outputs.subject }}
          html_body: file://plan-email.html
